<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hlášení pojistné události — Direct</title>
<style>
/* === RESET === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:'Direct Sans',Arial,sans-serif;background:#004033;min-height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea,select{font-family:inherit}
img{display:block;max-width:100%}

/* === DS TOKENS === */
:root{
  --gd-bg:#004033;--gd-content:#F9FCE2;
  --gdef-bg:#C4DE00;--gdef-content:#004033;--gdef-bg-light:#FFFFFF;
  --gl-bg:#EAF3A3;--gl-content:#004033;
  --light-bg:#C4E9DC;--light-bg-light:#FFFFFF;--light-content:#004033;
  --light-content-sec:#006B55;--light-outline:#C4E9DC;--light-helper:#668C85;
  --light-forms-bg:#FFFFFF;--light-forms-outline:#006B55;--light-forms-hover:#D1F3E7;
  --success-bg:#6AE851;--success-content:#165313;
  --error-bg:#D02B1D;--error-content:#FFF3F1;
  --warning-bg:#FFB956;--warning-content:#6D1F00;
  --dis-bg:#CCD9D6;--dis-content:#668C85;
  --specific-focus:#006B55;
  --grey-25:#F2F5F5;--grey-50:#E5ECEB;--grey-100:#CCD9D6;--grey-500:#668C85;
  --ff:'Direct Sans',Arial,sans-serif;
  --sp-xxs:8px;--sp-xs:16px;--sp-s:20px;--sp-m:24px;--sp-l:32px;--sp-xl:40px;
  --r-s:8px;--r-m:20px;--r-l:28px;
  --shadow-menu:0 3px 6px rgba(0,64,51,.03),0 12px 12px rgba(0,64,51,.03),0 26px 16px rgba(0,64,51,.02),0 46px 19px rgba(0,64,51,.01),0 72px 20px rgba(0,64,51,0);
  --shadow-btn:-3px 3px 10px rgba(0,64,51,.13),-13px 12px 18px rgba(0,64,51,.12),-28px 28px 24px rgba(0,64,51,.07),-50px 50px 28px rgba(0,64,51,.02);
  --shadow-input:-2px 2px 7px rgba(0,64,51,.08),-9px 8px 12px rgba(0,64,51,.07),-19px 19px 16px rgba(0,64,51,.04),-35px 34px 19px rgba(0,64,51,.01);
}

/* === LAYOUT === */
.page-wrap{height:100dvh;overflow:hidden;background:linear-gradient(227deg,#005544 0%,#004033 100%);display:flex;flex-direction:column;align-items:center}

/* === HEADER === */
.chat-header{width:100%;max-width:600px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 var(--sp-m);height:56px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--grey-50)}
.progress-chip{font-size:13px;font-weight:700;color:var(--gd-bg);background:var(--gdef-bg);border-radius:20px;padding:6px 12px;letter-spacing:.2px;box-shadow:0 1px 0 rgba(0,64,51,.08);transition:opacity .3s}
.header-progress{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--grey-50);overflow:hidden}
.header-progress__fill{height:100%;width:0;background:var(--gdef-bg);border-radius:0 2px 2px 0;transition:width .35s ease}
.chat-header__brand{display:flex;align-items:center;gap:var(--sp-xxs)}
.chat-header__logo{width:32px;height:32px;background:var(--gd-bg);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#C4DE00;font-size:13px;font-weight:700;letter-spacing:.5px}
.chat-header__title{font-size:14px;font-weight:600;color:var(--gd-bg);letter-spacing:.7px}
.chat-header__step-label{font-size:12px;font-weight:500;color:var(--light-helper);letter-spacing:.24px}


/* === CHAT === */
.chat-area{flex:1;min-height:0;width:100%;max-width:600px;padding:16px var(--sp-m) 0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;background:#F2F5F5}
#chatSpacer{flex-shrink:0;width:100%}

/* === MESSAGES === */
.msg{display:flex;gap:8px;animation:msg-in 300ms cubic-bezier(.34,1.56,.64,1) both}
.msg--bot{align-items:flex-end;align-self:flex-start;max-width:88%}
.msg--bot.msg--wide{max-width:100%}
.msg--user{align-self:flex-end;flex-direction:row-reverse;max-width:80%}
.msg__avatar{width:32px;height:32px;border-radius:50%;background:var(--gd-bg);display:flex;align-items:center;justify-content:center;color:#C4DE00;flex-shrink:0}
.msg__bubble{background:#fff;border-radius:16px 16px 16px 4px;padding:12px 16px;box-shadow:var(--shadow-menu);font-size:14px;line-height:1.5;color:var(--gd-bg)}
.msg--user .msg__bubble{background:var(--gdef-bg);border-radius:16px 16px 4px 16px;color:var(--gd-bg);box-shadow:none}
.msg__card{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow-menu);width:100%}

/* === TYPING === */
.typing-dots{display:flex;align-items:center;gap:4px;padding:2px 0}
.typing-dot{width:8px;height:8px;border-radius:50%;background:var(--grey-500);animation:dot-pulse 1.2s ease-in-out infinite}
.typing-dot:nth-child(1){animation-delay:0s}.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.30s}

/* === BUTTONS === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--ff);font-size:14px;font-weight:600;letter-spacing:.7px;border-radius:28px;cursor:pointer;transition:background .15s,box-shadow .15s,color .15s,border-color .15s,transform .15s;white-space:nowrap;text-decoration:none}
.btn--lg{height:56px;padding:0 20px;border-radius:28px}
.btn--md{height:36px;padding:0 12px;border-radius:18px}
.btn--sm{height:32px;padding:0 10px;border-radius:16px}
.btn--primary{background:linear-gradient(227deg,#005544 0%,#004033 100%);color:#F9FCE2;box-shadow:var(--shadow-btn)}
.btn--primary:hover{background:linear-gradient(227deg,#00624F 0%,#005544 100%);box-shadow:-2px 2px 8px rgba(0,64,51,.12)}
.btn--secondary{background:#F9FCE2;color:#004033;border:1px solid #004033}
.btn--secondary:hover{box-shadow:inset 0 0 0 1px #004033}
.btn--tertiary{background:transparent;color:#004033;text-decoration:underline}
.btn--tertiary:hover{text-decoration:none}
.btn--full{width:100%}
.btn:disabled{cursor:not-allowed;background:var(--dis-bg);color:var(--dis-content);box-shadow:none;border-color:var(--dis-bg);opacity:1}

/* === INPUTS === */
.float-wrap{position:relative;width:100%;min-width:0}
.input-field{width:100%;height:56px;border-radius:16px;border:1px solid var(--light-forms-outline);background:var(--light-forms-bg);padding:22px 16px 8px;font-size:16px;font-weight:500;color:var(--gd-bg);outline:none;transition:border .1s,background .1s,box-shadow .15s;font-family:var(--ff)}
.input-field:hover{box-shadow:inset 0 0 0 1px var(--light-forms-outline)}
.input-field:focus{border:1px solid var(--specific-focus);background:var(--light-forms-hover);box-shadow:inset 0 0 0 3px var(--specific-focus),var(--shadow-input)}
.float-label{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:400;color:#006B55;pointer-events:none;transition:all .15s ease;transform-origin:left center;white-space:nowrap}
.input-field:focus~.float-label,.input-field.has-val~.float-label{top:14px;transform:translateY(0) scale(.75);font-size:12px;font-weight:500}
.float-label--always{top:14px;transform:translateY(0) scale(.75);font-size:12px;font-weight:500}
/* date overlay wrapper — clips iOS native picker height */
.date-wrap{position:relative;width:100%;height:56px;border-radius:16px;border:1px solid var(--light-forms-outline);background:var(--light-forms-bg);overflow:hidden;transition:border .1s,box-shadow .15s}
.date-wrap:focus-within{border:1px solid var(--specific-focus);background:var(--light-forms-hover);box-shadow:inset 0 0 0 3px var(--specific-focus),var(--shadow-input)}
.date-wrap input[type="date"]{position:absolute;inset:0;width:100%;height:200%;opacity:0;cursor:pointer;z-index:2;font-size:16px;color-scheme:light}
.date-display{position:absolute;inset:0;z-index:1;pointer-events:none;padding:22px 16px 8px;font-size:16px;font-weight:500;color:var(--gd-bg)}
.date-display:empty::before{content:attr(data-placeholder);color:var(--light-helper)}
.date-label{position:absolute;left:17px;top:14px;font-size:9px;font-weight:500;color:#006B55;pointer-events:none;z-index:3;letter-spacing:.3px}
.date-field{position:relative;width:100%;min-width:0}
.date-field .input-field{padding-right:58px}
.date-field:focus-within .input-field{border:1px solid var(--specific-focus);background:var(--light-forms-hover);box-shadow:inset 0 0 0 3px var(--specific-focus),var(--shadow-input)}
.date-picker-btn{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;color:var(--gd-bg);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.date-picker-native{position:absolute;right:8px;top:8px;width:40px;height:40px;opacity:0;z-index:3;cursor:pointer;color-scheme:light}
.date-picker-native::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;opacity:0}
textarea.input-field{height:auto;min-height:56px;max-height:120px;padding:16px;resize:none;overflow-y:auto;line-height:1.5}
.voice-wrap{position:relative;width:100%}
.voice-wrap textarea.input-field{min-height:120px;max-height:180px;padding:16px 16px 62px}
.voice-btn{position:absolute;right:8px;bottom:8px;min-height:40px;border-radius:20px;background:var(--light-bg);color:var(--gd-bg);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:background .15s,box-shadow .15s}
.voice-btn.listening{background:var(--gdef-bg);box-shadow:var(--shadow-menu)}
.voice-btn:focus-visible{outline:4px solid var(--specific-focus);outline-offset:2px}
.voice-status{min-height:18px;font-size:12px;font-weight:500;color:var(--light-helper);line-height:1.45;padding:0 2px}
.voice-status:empty{display:none}

/* === TAGS === */
.tag{display:inline-flex;align-items:center;height:20px;border-radius:10px;padding:0 8px;font-size:12px;font-weight:600;letter-spacing:.6px;line-height:20px;white-space:nowrap;gap:4px}
.tag--gdef{background:#C4DE00;color:#004033}.tag--gl{background:#EAF3A3;color:#004033}
.tag--success{background:#6AE851;color:#165313}.tag--error{background:#D02B1D;color:#FFF3F1}
.tag--warning{background:#FFB956;color:#6D1F00}.tag--grey{background:#fff;color:#809F99;border:1px solid #809F99}

/* === CLIENT CARD === */
.client-card{background:var(--gl-bg);border-radius:14px;padding:14px}
.client-card__name{font-size:16px;font-weight:600;color:var(--gd-bg);margin-bottom:4px}
.client-card__row{font-size:13px;color:#417523;margin-bottom:2px}
.client-card__tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* === AI RESULT CARD === */
.ai-card{border:1px solid var(--gl-bg);border-radius:14px;overflow:hidden}
.ai-card__header{background:var(--gl-bg);padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gd-bg)}
.ai-card__body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ai-dmg-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gd-bg)}

/* === UPLOAD CARD === */
.upload-card{border:2px dashed var(--gdef-bg);border-radius:14px;padding:24px 20px;text-align:center;background:#F9FCE2;position:relative}
.upload-card.drag-over{border-color:var(--gd-bg);background:var(--gl-bg)}
.upload-card__title{font-size:14px;font-weight:500;color:var(--gd-bg);margin:10px 0 4px}
.upload-card__sub{font-size:12px;color:var(--light-helper);margin-bottom:14px}
.upload-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.upload-thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--grey-100);display:flex;align-items:center;justify-content:center;color:var(--grey-500);font-size:11px;font-weight:500;overflow:hidden}
.upload-thumb img{width:100%;height:100%;object-fit:cover}
.upload-overlay{position:absolute;inset:0;background:rgba(249,252,226,.92);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.upload-overlay__text{font-size:13px;font-weight:500;color:var(--gd-bg)}
.media-doc{display:flex;flex-direction:column;gap:16px}
.media-groups{display:grid;gap:16px;align-items:stretch}
.media-info{background:var(--gl-bg);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;color:var(--gd-bg);font-size:13px;line-height:1.45}
.media-info__icon{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.media-info__icon svg{width:18px;height:18px}
.media-group{display:flex;flex-direction:column;gap:8px;min-width:0}
.media-head{padding:0 2px}
.media-title{font-size:16px;font-weight:600;color:var(--gd-bg);line-height:1.3;margin-bottom:4px}
.media-helper{font-size:13px;color:var(--light-helper);line-height:1.4}
.media-zone{border:2px dashed var(--light-outline);border-radius:14px;min-height:104px;padding:16px;display:flex;align-items:center;gap:16px;background:var(--grey-25);cursor:pointer;text-align:left;transition:background .15s,border-color .15s;width:100%}
.media-zone:hover,.media-zone:active{background:var(--light-bg);border-color:var(--light-forms-outline)}
.media-zone__icon{width:36px;height:36px;color:var(--light-helper);flex-shrink:0}
.media-zone__icon svg{width:36px;height:36px;display:block}
.media-zone__copy{display:flex;flex-direction:column;gap:4px;min-width:0}
.media-zone__text{font-size:15px;font-weight:600;color:var(--gd-bg);line-height:1.3}
.media-zone__sub{font-size:12px;color:var(--light-helper);line-height:1.35}
.media-section{display:none}
.media-section.visible{display:block}
.media-badge{display:inline-flex;align-items:center;gap:6px;background:var(--light-bg);color:var(--gd-bg);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;margin-bottom:10px}
.media-badge svg{width:14px;height:14px}
.media-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.media-thumb{width:72px;height:72px;border-radius:12px;overflow:hidden;position:relative;background:var(--grey-100);flex:0 0 72px}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.media-video-badge{position:absolute;left:6px;bottom:6px;border-radius:14px;padding:3px 7px;background:rgba(0,64,51,.78);color:#fff;font-size:10px;font-weight:700;line-height:1}
.media-thumb__rm{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;border:none;cursor:pointer}
.media-add{display:inline-flex;align-items:center;gap:8px;color:var(--gd-bg);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 0;border:none;background:none;cursor:pointer}
.media-add:hover{text-decoration:none}
.file-hidden{display:none}

/* === AI ANALYSIS === */
.ai-loading-card{text-align:center;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ai-loading-icon{width:72px;height:72px;border-radius:50%;background:var(--light-bg);display:flex;align-items:center;justify-content:center;color:var(--gd-bg);animation:pulse 1.6s ease-in-out infinite}
.ai-spinner{width:40px;height:40px;border:4px solid var(--light-bg);border-top-color:var(--gd-bg);border-radius:50%;animation:spin .85s linear infinite}
.ai-loading-title{font-size:18px;font-weight:600;color:var(--gd-bg)}
.ai-loading-sub{font-size:13px;color:var(--light-helper);line-height:1.45;margin-top:4px}
.ai-result-card{display:flex;flex-direction:column;gap:12px}
.analysis-info{background:var(--gl-bg);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:flex-start;color:var(--gd-bg);font-size:13px;line-height:1.4}
.analysis-info__icon{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.result-card{border:1px solid var(--grey-50);border-radius:14px;padding:12px;background:#fff}
.result-card__title{font-size:15px;font-weight:600;color:var(--gd-bg);margin-bottom:2px}
.found-dmg-list{display:flex;flex-direction:column}
.found-dmg-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--grey-50)}
.found-dmg-item:last-child{border-bottom:none}
.found-dmg-icon{width:20px;height:20px;flex-shrink:0;color:var(--grey-500);margin-top:2px}
.found-dmg-texts{flex:1;min-width:0}
.found-dmg-name{font-size:15px;font-weight:500;color:var(--gd-bg);line-height:1.25}
.found-dmg-sub{font-size:12px;color:var(--light-helper);line-height:1.35;margin-top:1px}
.found-dmg-edit{width:32px;height:32px;border-radius:10px;color:var(--light-content-sec);display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;flex-shrink:0}
.found-dmg-edit:hover{background:var(--grey-25);color:var(--gd-bg)}
.btn-add-dmg{display:inline-flex;align-items:center;gap:8px;color:var(--gd-bg);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:6px 0 0;border:none;background:none;cursor:pointer}
.btn-add-dmg:hover{text-decoration:none}
.asset-section{display:flex;flex-direction:column;gap:6px}
.asset-section__title{font-size:15px;font-weight:600;color:var(--gd-bg);line-height:1.3}
.asset-section__helper{font-size:13px;color:var(--light-helper);line-height:1.4}
.textarea-counter{position:absolute;left:16px;bottom:18px;font-size:12px;font-weight:500;color:var(--light-helper);pointer-events:none}
.asset-voice-wrap textarea.input-field{min-height:96px;max-height:160px;padding:16px 16px 58px}

/* === DAMAGE LIST === */
.damage-list{display:flex;flex-direction:column;gap:8px}
.dmg-item{display:flex;align-items:center;gap:8px;background:var(--grey-25);border-radius:10px;padding:8px 10px}
.dmg-item__text{flex:1;font-size:14px;color:var(--gd-bg)}
.dmg-item__del{width:24px;height:24px;border-radius:50%;background:var(--grey-100);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--grey-500);flex-shrink:0;transition:background .15s,color .15s;border:none;padding:0}
.dmg-item__del:hover{background:var(--error-bg);color:#fff}

/* === COVERAGE === */
.coverage-list{display:flex;flex-direction:column}
.cov-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--grey-50)}
.cov-row:last-child{border-bottom:none}
.cov-row__text{font-size:14px;color:var(--gd-bg);flex:1}
.cov-row__actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.why-btn{font-size:11px;font-weight:600;color:var(--light-content-sec);background:var(--grey-25);border-radius:8px;padding:3px 8px;border:none;cursor:pointer;letter-spacing:.3px;white-space:nowrap}
.why-btn:hover{background:var(--grey-50)}
.coverage-summary{display:flex;flex-direction:column;gap:14px}
.coverage-section{display:flex;flex-direction:column;gap:6px}
.coverage-section__title{font-size:15px;font-weight:600;color:var(--gd-bg);line-height:1.3}
.coverage-card{border:1px solid var(--grey-50);border-radius:14px;background:#fff;padding:8px 14px}
.coverage-item{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--grey-50)}
.coverage-item:last-child{border-bottom:none}
.coverage-icon{width:24px;height:24px;flex-shrink:0;margin-top:2px}
.coverage-texts{flex:1;min-width:0}
.coverage-name{font-size:15px;font-weight:500;color:var(--gd-bg);line-height:1.3}
.coverage-sub{font-size:13px;color:var(--light-helper);line-height:1.4;margin-top:2px}
.coverage-more{display:inline-flex;align-items:center;font-size:13px;font-weight:500;color:var(--light-content-sec);background:none;border:none;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.coverage-more:hover{text-decoration:none}
.helper-block{border:1px solid var(--grey-50);border-radius:14px;overflow:hidden;background:#fff}
.helper-trigger{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:none;cursor:pointer;text-align:left;color:var(--gd-bg)}
.helper-trigger:hover{background:var(--grey-25)}
.helper-ico{width:36px;height:36px;border-radius:50%;background:var(--gl-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gd-bg)}
.helper-title{font-size:15px;font-weight:600;color:var(--gd-bg);line-height:1.3;flex:1}
.helper-chevron{width:18px;height:18px;color:var(--light-helper);transition:transform .2s;flex-shrink:0}
.helper-block.open .helper-chevron{transform:rotate(180deg)}
.helper-expand{display:none;padding:12px 14px;background:var(--grey-25);border-top:1px solid var(--grey-50);flex-direction:column;gap:10px}
.helper-block.open .helper-expand{display:flex}
.helper-chat-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:16px;border:1px solid var(--grey-50);background:#fff}

// ─── HELPERS ──────────────────────────────────────────────
const chat = document.getElementById('chatArea');
const bar  = document.getElementById('inputBar');
const sleep = ms => new Promise(r => setTimeout(r, ms));

const spacer = document.createElement('div');
spacer.id = 'chatSpacer';
chat.appendChild(spacer);

function syncPadding() {
  // mobile: bar is in-flow, no fixed overlap → minimal spacer
  // tablet+: bar is fixed, spacer prevents last message hiding under bar
  const isFixed = window.innerWidth >= 768;
  const offset = window.innerWidth >= 1024 ? 80 : 64;
  spacer.style.height = isFixed ? (bar.offsetHeight + offset) + 'px' : '16px';
  chat.appendChild(spacer);
}
function updateChatPadding() { setTimeout(syncPadding, 60); }
function scrollBot() {
  const doScroll = () => { syncPadding(); chat.scrollTop = chat.scrollHeight; };
  setTimeout(doScroll, 50);
  setTimeout(doScroll, 220);
}

function appendMsg(who, content) {
  const row = document.createElement('div'); row.className = `msg msg--${who}`;
  if (who === 'bot') {
    const av = document.createElement('div'); av.className = 'msg__avatar'; av.innerHTML = ICO.avatar; row.appendChild(av);
  }
  const wrap = document.createElement('div');
  if (content instanceof HTMLElement) { wrap.className = 'msg__card'; wrap.appendChild(content); }
  else { wrap.className = 'msg__bubble'; wrap.textContent = content; }
  row.appendChild(wrap); chat.appendChild(row); scrollBot(); return wrap;
}

async function botMsg(text, delay = 900) {
  const row = document.createElement('div'); row.className = 'msg msg--bot';
  const av = document.createElement('div'); av.className = 'msg__avatar'; av.innerHTML = ICO.avatar;
  const bub = document.createElement('div'); bub.className = 'msg__bubble';
  bub.innerHTML = `<div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  row.appendChild(av); row.appendChild(bub); chat.appendChild(row); scrollBot();
  await sleep(delay);
  chat.removeChild(row); return appendMsg('bot', text);
}

async function botCard(el, delay = 800) {
  const row = document.createElement('div'); row.className = 'msg msg--bot';
  const av = document.createElement('div'); av.className = 'msg__avatar'; av.innerHTML = ICO.avatar;
  const bub = document.createElement('div'); bub.className = 'msg__bubble';
  bub.innerHTML = `<div class="typing-dots"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  row.appendChild(av); row.appendChild(bub); chat.appendChild(row); scrollBot();
  await sleep(delay); chat.removeChild(row); return appendMsg('bot', el);
}

function userMsg(text) {
  progressCount = Math.min(progressCount + 1, PROGRESS_TOTAL);
  updateProgress(Math.round(progressCount / PROGRESS_TOTAL * 100));
  appendMsg('user', text);
}

function setBar(html) {
  bar.innerHTML = `<div class="bar-inner">${html}</div>`;
  // immediate + delayed scroll so last message is always visible
  syncPadding(); chat.scrollTop = chat.scrollHeight;
  setTimeout(() => { syncPadding(); chat.scrollTop = chat.scrollHeight; }, 100);
}
function clearBar() { bar.innerHTML = ''; updateChatPadding(); }
function setupFloat(input) {
  const upd = () => input.value ? input.classList.add('has-val') : input.classList.remove('has-val');
  input.addEventListener('input', upd); input.addEventListener('change', upd); upd();
}

function normalizeDateChars(value) {
  return value
    .replace(/[,/\-\s]/g, '.')
    .replace(/[^\d.]/g, '')
    .replace(/\.{2,}/g, '.');
}
function isValidMonthNumber(value) {
  const month = Number(value);
  return value.length > 0 && month >= 1 && month <= 12;
}
function splitDateParts(rawValue, options = {}) {
  const value = normalizeDateChars(rawValue);
  const isDeleting = options.isDeleting === true;

  if (!value.includes('.')) {
    const digits = value.replace(/\D/g, '').slice(0, 8);
    if (isDeleting || digits.length <= 2) {
      return { day: digits.slice(0, 2), month: '', year: '', dayDone: !isDeleting && digits.length === 2, monthDone: false };
    }

    const day = digits.slice(0, 2);
    const rest = digits.slice(2);
    let month = '';
    let year = '';
    if (rest.length <= 1) {
      month = rest;
    } else {
      const twoDigitMonth = rest.slice(0, 2);
      if (isValidMonthNumber(twoDigitMonth) || twoDigitMonth.startsWith('0')) {
        month = twoDigitMonth;
        year = rest.slice(2, 6);
      } else {
        month = rest.slice(0, 1);
        year = rest.slice(1, 5);
      }
    }
    return { day, month, year, dayDone: true, monthDone: month.length === 2 || year.length > 0 };
  }

  const dotCount = (value.match(/\./g) || []).length;
  const rawParts = value.split('.');
  const rawDay = (rawParts.shift() || '').replace(/\D/g, '');
  const day = rawDay.slice(0, 2);
  const dayOverflow = rawDay.slice(2);
  const rawMonth = dayOverflow + (rawParts.shift() || '').replace(/\D/g, '');
  const explicitMonthSeparator = dotCount >= 2;
  let month = '';
  let year = '';

  if (explicitMonthSeparator) {
    month = rawMonth.slice(0, 2);
    year = (rawMonth.slice(2) + rawParts.join('').replace(/\D/g, '')).slice(0, 4);
  } else if (rawMonth.length <= 1) {
    month = rawMonth;
  } else {
    const twoDigitMonth = rawMonth.slice(0, 2);
    if (isValidMonthNumber(twoDigitMonth) || twoDigitMonth.startsWith('0')) {
      month = twoDigitMonth;
      year = rawMonth.slice(2, 6);
    } else {
      month = rawMonth.slice(0, 1);
      year = rawMonth.slice(1, 5);
    }
  }

  return {
    day,
    month,
    year,
    dayDone: value.includes('.') || (!isDeleting && day.length === 2),
    monthDone: explicitMonthSeparator || month.length === 2 || year.length > 0
  };
}
function formatDateParts(parts) {
  let formatted = parts.day;
  if (parts.dayDone) formatted += '.';
  formatted += parts.month;
  if (parts.monthDone) formatted += '.';
  formatted += parts.year;
  return formatted.slice(0, 10);
}
function caretFromDigitCount(value, digitCount, moveAfterNextSeparator) {
  if (digitCount <= 0) return 0;
  let seen = 0;
  let pos = value.length;
  for (let i = 0; i < value.length; i++) {
    if (/\d/.test(value[i])) seen++;
    if (seen === digitCount) { pos = i + 1; break; }
  }
  if (moveAfterNextSeparator && value[pos] === '.') pos++;
  return pos;
}
function maskDateInput(input, event = null) {
  const inputType = event?.inputType || '';
  const isDeleting = inputType.startsWith('delete');
  const caret = input.selectionStart ?? input.value.length;
  const isCaretAtEnd = caret >= input.value.length;
  const digitsBeforeCaret = input.value.slice(0, caret).replace(/\D/g, '').length;
  const formatted = formatDateParts(splitDateParts(input.value, { isDeleting }));

  input.value = formatted;
  syncDatePickerFromText(input);

  const nextCaret = isCaretAtEnd ? formatted.length : caretFromDigitCount(formatted, digitsBeforeCaret, !isDeleting);
  requestAnimationFrame(() => {
    if (document.activeElement === input) input.setSelectionRange(nextCaret, nextCaret);
  });
}
function handleDateBeforeInput(event) {
  if (event.inputType !== 'insertText' || !/[.,/\-\s]/.test(event.data || '')) return;

  const input = event.target;
  const start = input.selectionStart;
  const end = input.selectionEnd;
  if (start === null || end === null || start !== end) return;

  const before = normalizeDateChars(input.value.slice(0, start));
  const after = input.value.slice(end);

  if (/^\d{1,2}$/.test(before) || /^\d{1,2}\.\d{1,2}$/.test(before)) {
    event.preventDefault();
    input.value = `${before}.${after}`.slice(0, 10);
    const caret = Math.min(before.length + 1, input.value.length);
    input.setSelectionRange(caret, caret);
    syncDatePickerFromText(input);
    return;
  }

  if (before.endsWith('.')) {
    event.preventDefault();
    input.setSelectionRange(start, start);
  }
}
function handleDateKeydown(event) {
  if (event.key !== 'Backspace' && event.key !== 'Delete') return;

  const input = event.target;
  const start = input.selectionStart;
  const end = input.selectionEnd;
  if (start === null || end === null || start !== end) return;

  const removeIndex = event.key === 'Backspace' ? start - 1 : start;
  if (removeIndex < 0 || input.value[removeIndex] !== '.') return;

  event.preventDefault();
  input.value = input.value.slice(0, removeIndex) + input.value.slice(removeIndex + 1);
  input.setSelectionRange(removeIndex, removeIndex);
  maskDateInput(input, { inputType: event.key === 'Backspace' ? 'deleteContentBackward' : 'deleteContentForward' });
}
function parseDateValue(value) {
  const normalized = value.trim().replace(/[,/\-\s]/g, '.').replace(/\.{2,}/g, '.');
  const match = normalized.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!match) return null;

  const day = Number(match[1]);
  const month = Number(match[2]);
  const year = Number(match[3]);
  const date = new Date(year, month - 1, day);
  if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (year < 1900 || date > today) return null;

  return { day, month, year, date };
}
function isValidDateValue(value) {
  return Boolean(parseDateValue(value));
}
function formatDateDisplay(value) {
  const parsed = parseDateValue(value);
  if (!parsed) return value;
  return `${String(parsed.day).padStart(2, '0')}.${String(parsed.month).padStart(2, '0')}.${parsed.year}`;
}
function normalizeDateInput(input) {
  if (isValidDateValue(input.value)) input.value = formatDateDisplay(input.value);
}
function displayToIsoDate(value) {
  const parsed = parseDateValue(value);
  if (!parsed) return '';
  return `${parsed.year}-${String(parsed.month).padStart(2, '0')}-${String(parsed.day).padStart(2, '0')}`;
}
function isoToDisplayDate(value) {
  const match = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return '';
  return `${match[3]}.${match[2]}.${match[1]}`;
}
function todayIsoLocal() {
  const today = new Date();
  return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
}
function syncDatePickerFromText(input) {
  const pickerId = input?.dataset?.picker;
  if (!pickerId) return;
  const picker = document.getElementById(pickerId);
  if (picker) picker.value = isValidDateValue(input.value) ? displayToIsoDate(input.value) : '';
}
function bindDateField(inputId, pickerId) {
  const input = document.getElementById(inputId);
  const picker = document.getElementById(pickerId);
  if (!input) return;

  input.dataset.picker = pickerId;
  input.addEventListener('beforeinput', handleDateBeforeInput);
  input.addEventListener('keydown', handleDateKeydown);
  input.addEventListener('input', e => maskDateInput(input, e));
  input.addEventListener('blur', () => { normalizeDateInput(input); syncDatePickerFromText(input); });

  if (!picker) return;
  picker.min = '1900-01-01';
  picker.max = todayIsoLocal();
  syncDatePickerFromText(input);
  picker.addEventListener('change', () => {
    input.value = isoToDisplayDate(picker.value);
    input.focus();
    input.dispatchEvent(new Event('input', { bubbles: true }));
    input.dispatchEvent(new Event('change', { bubbles: true }));
  });
}
function dateValueOrFallback(inputId, fallback) {
  const input = document.getElementById(inputId);
  const value = input?.value.trim() || '';
  if (!value) return fallback;
  return isValidDateValue(value) ? formatDateDisplay(value) : value;
}

let voiceDescTimer;
function startDescVoiceInput(onDone) {
  const textarea = document.getElementById('inDesc');
  const btn = document.getElementById('btnVoiceDesc');
  const label = document.getElementById('voiceDescLabel');
  const status = document.getElementById('voiceDescStatus');
  if (!textarea || !btn || !label || !status || btn.classList.contains('listening')) return;

  clearTimeout(voiceDescTimer);
  btn.classList.add('listening');
  btn.setAttribute('aria-label', 'Probíhá diktování popisu události');
  label.textContent = 'Poslouchám…';
  status.textContent = 'Simulace diktování je spuštěná.';
  updateChatPadding();

  voiceDescTimer = setTimeout(() => {
    const dictatedText = 'Praskla nám sklokeramická deska u jedné plotýnky. Nevím přesně kdy, všimli jsme si toho při vaření.';
    const nextValue = textarea.value.trim() ? `${textarea.value.trim()} ${dictatedText}` : dictatedText;
    const max = Number(textarea.getAttribute('maxlength')) || 1000;
    textarea.value = nextValue.slice(0, max);

    btn.classList.remove('listening');
    btn.setAttribute('aria-label', 'Nadiktovat popis události');
    label.textContent = 'Namluvit';
    status.textContent = 'Text byl doplněn z hlasového zadání.';
    if (typeof onDone === 'function') onDone();
    textarea.focus();
    scrollBot();
  }, 1200);
}

async function step1() {
  updateProgress(0);
  await sleep(300);
  await botMsg('Dobrý den! Jsem váš asistent Direct pro hlášení pojistné události.', 500);
  await botMsg('Potřebujeme nejprve ověřit vaši totožnost.', 1000);

  setBar(`
    <div class="float-wrap"><input class="input-field" type="text" id="inFn" placeholder=" " autocomplete="given-name"><label class="float-label" for="inFn">Jméno</label></div>
    <div class="float-wrap"><input class="input-field" type="text" id="inLn" placeholder=" " autocomplete="family-name"><label class="float-label" for="inLn">Příjmení</label></div>
    <div class="bar-row">
      <div class="date-field" style="flex:0 0 calc(50% - 4px)">
        <input class="input-field" type="text" id="inDob" placeholder="DD.MM.RRRR" inputmode="decimal" autocomplete="bday" maxlength="10">
        <label class="float-label float-label--always" for="inDob">Datum narození</label>
        <div class="date-picker-btn" aria-hidden="true">${ICO.calendar}</div>

    if (dobRaw) CLIENT.dob = dobRaw;
    clearBar(); userMsg(CLIENT.name); await step1_client();
  });
}

async function step1_describe() {
  await botMsg('Popište prosím, co se stalo – uveďte, co bylo poškozeno, jak k tomu došlo a odhadovaný rozsah škody.', 1200);

  setBar(`
    <div class="voice-wrap">
      <textarea class="input-field" id="inDesc" placeholder="Popište co se přihodilo..." rows="2" maxlength="1000"></textarea>

        <span id="voiceDescLabel">Namluvit</span>

    <div class="hint-box">💡 Příklad: „Při vaření přetekl kastrol a zalil sklokeramickou desku, která praskla. Zároveň se poškodil povrch kuchyňské linky."</div>

  `);

  const resizeDesc = () => { ta.style.height='auto'; ta.style.height=Math.min(Math.max(ta.scrollHeight,120),180)+'px'; };
  ta.addEventListener('input', resizeDesc);
  document.getElementById('btnVoiceDesc').addEventListener('click', () => startDescVoiceInput(resizeDesc));

  document.getElementById('btnSendDesc').addEventListener('click', async () => {
    const desc = ta.value.trim() || 'Při vaření se poškodila sklokeramická deska a kuchyňská linka.';

async function step1_datetime() {
  await botMsg('Kdy přesně k události došlo?', 900);

  setBar(`
    <div class="bar-row">
      <div style="flex:1;min-width:0">
        <div class="date-field">
          <input class="input-field" type="text" id="inDate" placeholder="DD.MM.RRRR" inputmode="decimal" autocomplete="off" maxlength="10">
          <label class="float-label float-label--always" for="inDate">Datum</label>
          <div class="date-picker-btn" aria-hidden="true">${ICO.calendar}</div>
          <input type="date" id="inDatePicker" class="date-picker-native" aria-label="Vybrat datum události z kalendáře">
        </div>
      </div>
      <div style="flex:1;min-width:0"><div class="float-wrap"><input class="input-field" type="text" id="inTime" placeholder="09:00" maxlength="5" inputmode="numeric" autocomplete="off"><label class="float-label float-label--always" for="inTime">Čas</label></div></div>
    </div>
    <button class="btn btn--lg btn--primary btn--full" id="btnDateTime">Potvrdit</button>
  `);

  const dateEl = document.getElementById('inDate');
  setupFloat(dateEl);
  bindDateField('inDate', 'inDatePicker');

  // auto-colon: digits only, dot or colon triggers separator insert
  const timeEl = document.getElementById('inTime');
  timeEl.addEventListener('input', () => {
    const raw = timeEl.value;
    const hasSep = /[.:]/.test(raw);
    const digits = raw.replace(/\D/g, '');
    let v;
    if (digits.length > 2 || (digits.length === 2 && hasSep)) {
      v = digits.slice(0,2) + ':' + digits.slice(2,4);
    } else if (digits.length === 2 && hasSep) {
      v = digits + ':';
    } else {
      v = digits;
    }
    timeEl.value = v;
  });

  document.getElementById('btnDateTime').addEventListener('click', async () => {
    const d = dateValueOrFallback('inDate', '15. 5. 2025');
    const t = timeEl.value.trim() || '09:00';
    clearBar(); userMsg(`${d} v ${t}`); await step1_address();
  });
}

  setBar(`

}

function bindMediaUploadSection(section) {
  const zone = document.getElementById(`mediaZone-${section}`);
  const add = document.getElementById(`mediaAdd-${section}`);
  const input = document.getElementById(`mediaInput-${section}`);
  const inputMore = document.getElementById(`mediaInputMore-${section}`);

  if (zone && input) zone.addEventListener('click', () => input.click());
  if (add && inputMore) add.addEventListener('click', () => inputMore.click());
  if (input) input.addEventListener('change', () => handleMedia(input, section));
  if (inputMore) inputMore.addEventListener('change', () => handleMedia(inputMore, section));
}

async function handleMedia(input, section) {
  const files = Array.from(input.files || []);
  if (!files.length || !S.mediaFiles[section]) return;

  for (const file of files) {
    await new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => {
        S.mediaFiles[section].push({
          src: e.target.result,
          type: file.type || '',
          name: file.name || ''
        });
        resolve();
      };
      reader.onerror = resolve;
      reader.readAsDataURL(file);
    });
  }

  input.value = '';
  renderMediaSection(section);
}

function mediaCountLabel(count) {
  if (count === 1) return '1 soubor';
  if (count >= 2 && count <= 4) return `${count} soubory`;
  return `${count} souborů`;
}

function renderMediaSection(section) {
  const files = S.mediaFiles[section] || [];
  const grid = document.getElementById(`mediaGrid-${section}`);
  const uploadSection = document.getElementById(`mediaSection-${section}`);
  const zone = document.getElementById(`mediaZone-${section}`);
  const label = document.getElementById(`mediaCount-${section}`);
  if (!grid || !uploadSection || !zone || !label) return;

  uploadSection.classList.toggle('visible', files.length > 0);
  zone.style.display = files.length > 0 ? 'none' : 'flex';
  label.textContent = mediaCountLabel(files.length);
  grid.innerHTML = '';

  files.forEach((file, index) => {
    const isVideo = file.type.startsWith('video/');
    const thumb = document.createElement('div');
    thumb.className = 'media-thumb';
    thumb.innerHTML = isVideo
      ? `<video src="${file.src}" muted playsinline preload="metadata"></video><span class="media-video-badge">▶ VIDEO</span><button type="button" class="media-thumb__rm" aria-label="Odebrat video">✕</button>`
      : `<img src="${file.src}" alt=""><button type="button" class="media-thumb__rm" aria-label="Odebrat foto">✕</button>`;
    thumb.querySelector('.media-thumb__rm').addEventListener('click', () => removeMedia(section, index));
    grid.appendChild(thumb);
  });

  validateMediaStep();
  scrollBot();
}

function validateMediaStep() {
  const hasDetail = (S.mediaFiles.detail || []).length > 0;
  const hasOverall = (S.mediaFiles.overall || []).length > 0;
  const ok = hasDetail && hasOverall;
  const btn = document.getElementById('btnMediaContinue');
  const hint = document.getElementById('mediaHint');
  if (btn) btn.disabled = !ok;
  if (hint) {
    hint.textContent = ok
      ? 'Fotodokumentace je připravená k analýze'
      : `Chybí: ${[!hasDetail ? 'detailní pohled' : '', !hasOverall ? 'celkový pohled' : ''].filter(Boolean).join(' a ')}`;
  }
  return ok;
}

function removeMedia(section, index) {
  if (!S.mediaFiles[section]) return;
  S.mediaFiles[section].splice(index, 1);
  renderMediaSection(section);
}

async function runAnalysis() {
  const count = S.mediaFiles.detail.length + S.mediaFiles.overall.length;
  userMsg(`Fotodokumentace přiložena (${mediaCountLabel(count)})`);
  await botCard(createAiLoadingCard(), 300);
  await sleep(2800);
  await goStep3();
}

function updateAssetCounter() {
  const textarea = document.getElementById('assetDetails');
  const counter = document.getElementById('assetDetailsCounter');
  if (!textarea || !counter) return;
  const max = Number(textarea.getAttribute('maxlength')) || 1000;
  if (textarea.value.length > max) textarea.value = textarea.value.slice(0, max);
  counter.textContent = `${textarea.value.length} / ${max} znaků`;
}

function resizeAssetTextarea() {
  const textarea = document.getElementById('assetDetails');
  if (!textarea) return;
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(Math.max(textarea.scrollHeight, 96), 160) + 'px';
}

function setupAssetDetailsInput() {
  const textarea = document.getElementById('assetDetails');
  if (!textarea) return;
  const sync = () => {
    S.assetDetails = textarea.value;
    updateAssetCounter();
    resizeAssetTextarea();
    updateChatPadding();
  };
  textarea.addEventListener('input', sync);
  document.getElementById('btnAssetVoice')?.addEventListener('click', () => startAssetVoiceInput(sync));
  sync();
}

let assetVoiceTimer;
function startAssetVoiceInput(onDone) {
  const textarea = document.getElementById('assetDetails');
  const btn = document.getElementById('btnAssetVoice');
  const label = document.getElementById('assetVoiceLabel');
  const status = document.getElementById('assetVoiceStatus');
  if (!textarea || !btn || !label || !status || btn.classList.contains('listening')) return;

  clearTimeout(assetVoiceTimer);
  btn.classList.add('listening');
  btn.setAttribute('aria-label', 'Probíhá diktování seznamu a rozměru poškozeného majetku');
  label.textContent = 'Poslouchám…';
  status.textContent = 'Simulace diktování je spuštěná.';
  updateChatPadding();

  assetVoiceTimer = setTimeout(() => {
    const dictatedText = 'Je to sklokeramická deska Mora, klasická šířka asi 60 centimetrů, prasklá u pravé přední plotýnky.';
    const nextValue = textarea.value.trim() ? `${textarea.value.trim()} ${dictatedText}` : dictatedText;
    const max = Number(textarea.getAttribute('maxlength')) || 1000;
    textarea.value = nextValue.slice(0, max);

    btn.classList.remove('listening');
    btn.setAttribute('aria-label', 'Nadiktovat seznam a rozměr poškozeného majetku');
    label.textContent = 'Namluvit';
    status.textContent = 'Text byl doplněn z hlasového zadání.';
    if (typeof onDone === 'function') onDone();
    textarea.focus();
    scrollBot();
  }, 1200);
}

  const isEdit = Boolean(damage);
  setBar(`

  const nameInput = document.getElementById('inDamageName');
  const subInput = document.getElementById('inDamageSub');
  nameInput.value = damage?.text || '';
  subInput.value = damage?.sub || '';

  subInput.addEventListener('input', () => { subInput.style.height = 'auto'; subInput.style.height = Math.min(subInput.scrollHeight, 120) + 'px'; });

    clearBar();
    userMsg('Pokračovat');
    await goStep5();
  });
}

function createCoverageSection(title, items, type) {
  const section = document.createElement('div');
  section.className = 'coverage-section';

  const ttl = document.createElement('div');
  ttl.className = 'coverage-section__title';
  ttl.textContent = title;
  section.appendChild(ttl);

  const card = document.createElement('div');
  card.className = 'coverage-card';
  items.forEach(d => card.appendChild(createCoverageItem(d, type)));
  section.appendChild(card);

  return section;
}

function createCoverageItem(d, type) {
  const row = document.createElement('div');
  row.className = 'coverage-item';

  const iconWrap = document.createElement('div');
  iconWrap.innerHTML = type === 'covered' ? ICO.covCheck : (type === 'uncovered' ? ICO.covCross : ICO.covClock);
  row.appendChild(iconWrap.firstElementChild);

  const texts = document.createElement('div');
  texts.className = 'coverage-texts';

  const name = document.createElement('div');
  name.className = 'coverage-name';
  name.textContent = d.text;
  texts.appendChild(name);

  const sub = document.createElement('div');
  sub.className = 'coverage-sub';
  sub.textContent = coverageSubText(d, type);
  texts.appendChild(sub);

  if (type === 'uncovered') {
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'coverage-more';
    more.textContent = 'Chci vědět více';
    more.addEventListener('click', () => showRejectionSheet(d.text));
    texts.appendChild(more);
  }

  row.appendChild(texts);
  return row;
}

function coverageSubText(d, type) {
  if (type === 'covered') return d.sub || 'Živelní škoda — součást pojistky';
  if (type === 'uncovered') return d.sub || 'Opotřebení — mimo rozsah pojistky';
  return d.sub || 'Ručně přidáno — čeká na posouzení';
}

  document.getElementById('btnSaveAccount').addEventListener('click', () => saveStep5Account());
  setupFloat(document.getElementById('inAccount'));

  setBar(`<button class="btn btn--lg btn--primary btn--full" id="btnConfirmPay">Odeslat peníze na účet</button>`);
  document.getElementById('btnConfirmPay').addEventListener('click', async () => {
    clearBar();
    userMsg('Odeslat peníze na účet');
    await step5_success();
  });
  scrollBot();
}

function payoutDamageSub(covered) {
  if (!covered.length) return 'Pojištěné škody';
  if (covered.length === 1) return covered[0].sub || covered[0].text;
  return `${covered[0].text} + ${covered.length - 1} další ${covered.length - 1 === 1 ? 'škoda' : (covered.length - 1 < 5 ? 'škody' : 'škod')}`;
}

function step5_accountEdit() {
  const edit = document.getElementById('accountEdit');
  if (!edit) return;
  edit.classList.toggle('open');
  if (edit.classList.contains('open')) {
    const input = document.getElementById('inAccount');
    setTimeout(() => input?.focus(), 0);
  }
  scrollBot();
}

function saveStep5Account() {
  const input = document.getElementById('inAccount');
  const display = document.getElementById('accountDisplay');
  const edit = document.getElementById('accountEdit');
  if (!input || !display) return;
  S.account = input.value.trim() || S.account;
  display.textContent = S.account;
  edit?.classList.remove('open');
  scrollBot();
}

async function step5_success() { updateProgress(100); progressCount = PROGRESS_TOTAL;
  const covered = S.damages.filter(d => d.covered);
  const net = covered.reduce((s,d)=>s+d.amount,0) - DEDUCTIBLE;
  await botMsg(`Hotovo! Škoda je vyřešená. Na váš účet ${S.account} posíláme ${net.toLocaleString('cs-CZ')} Kč.`, 1000);
  await sleep(800);

  const ref = `2025-${String(Math.floor(1000+Math.random()*8999))}-${String(Math.floor(100+Math.random()*899))}`;
  const sc = document.createElement('div');
  sc.className = 'success-card';
  sc.innerHTML = `
    <div class="success-icon">${ICO.checkCircle}</div>
    <div class="success-title">Škoda je vyřešená!</div>
    <div class="success-ref">Číslo události: ${ref}</div>
    <div class="success-note">
      Peníze očekávejte během pár minut.<br><br>
      Přehled řešení škody jsme poslali na <strong>${CLIENT.email}</strong>.
    </div>
  `;
  await botCard(sc, 200);

  await sleep(500);
  await botMsg('Jak hodnotíte průběh nahlašování?', 700);

  const ratingEl = document.createElement('div');
  ratingEl.innerHTML = `
    <div class="star-rating" id="starRow">${[1,2,3,4,5].map(i=>`<button class="star-btn" id="s${i}" data-v="${i}">${ICO.star}</button>`).join('')}</div>
    <div class="rating-label" id="ratingLbl"></div>
  `;
  await botCard(ratingEl, 400);

  [1,2,3,4,5].forEach(i => {
    const btn = document.getElementById(`s${i}`);
    btn.addEventListener('mouseenter', () => { if (!S.rating) highlightStars(i); });
    btn.addEventListener('mouseleave', () => { if (!S.rating) highlightStars(0); });
    btn.addEventListener('click', async () => {
      if (S.rating) return;
      S.rating = i;
      highlightStars(i);
      [1,2,3,4,5].forEach(j => { if(j<=i){ const b=document.getElementById(`s${j}`); b.classList.add('bounce'); setTimeout(()=>b.classList.remove('bounce'),400+j*50); } });
      document.getElementById('ratingLbl').textContent = RATING_TEXT[i];
      await sleep(600);
      setBar(`<button class="btn btn--lg btn--primary btn--full" id="btnSendRating">Odeslat hodnocení</button>`);
      document.getElementById('btnSendRating').addEventListener('click', async () => {
        clearBar();
        userMsg('★'.repeat(i)+'☆'.repeat(5-i));
        await sleep(200);
        await botMsg('Děkujeme za hodnocení! Přejeme příjemný zbytek dne.', 800);
      });
    });
  });
}

function highlightStars(n) {
  [1,2,3,4,5].forEach(i => {
    const btn = document.getElementById(`s${i}`); if (!btn) return;
    if (i<=n){ btn.innerHTML=ICO.starFull; btn.classList.add('lit'); }
    else { btn.innerHTML=ICO.star; btn.classList.remove('lit'); }
  });
}

// ─── INIT ──────────────────────────────────────────────────
step1();

// ResizeObserver: whenever input bar height changes, fix padding + scroll
new ResizeObserver(() => {
  syncPadding();
  chat.scrollTop = chat.scrollHeight;
}).observe(bar);
</script>
